<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35-transformations</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section {
            img {
                display: block;
                margin: 2rem auto;

                &.transform1 {
                    transform: rotate(90deg); /*90deg*/
                }
                &.transform2 {
                    transform: scale(.5); 
                }
                &.transform3 {
                    transform: translatex(-100px); 
                }
                &.transform4 {
                    transform: skew(30deg); 
                }
                &.transform5 {
                    transform: rotate(45deg) scale(1.4); 
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>35-transformations</h1>
            <img src="../src/imgs/logo-css.png" alt="css">
            <h3>Property (transform) allowing 2D or 3D manipulation of elements, such as translate(), rotate(), scale(), and skew().</h3>
        </header>
        <section>
           
            <h2 class="subtitle">Rotate: 90deg</h2>
            <img class="transform1" src="imgs/mario.png" width="180px">
            <h2 class="subtitle">Scale: 0.5</h2>
            <img class="transform2" src="imgs/mario.png" width="180px">
            <h2 class="subtitle">TranslateX: -100px</h2>
            <img class="transform3" src="imgs/mario.png" width="180px">
            <h2 class="subtitle">Skew: 30deg</h2>
            <img class="transform4" src="imgs/mario.png" width="180px">
            <h2 class="subtitle">Rotate Scale:</h2>
            <img class="transform5" src="imgs/mario.png" width="180px">
    
        </section>
    </main>
</body>
</html>
